version: '3.9'

services:
  data-pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nba-data-pipeline
    volumes:
      - ./data:/app/data
      - ./notebooks:/app/notebooks
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
    networks:
      - pipeline-network
    restart: unless-stopped

networks:
  pipeline-network:
    driver: bridge
